<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geo Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f0f2;--card:#fff;--ink:#0d2b3e;--mut:#5b7685;--acc:#0a7e8c;--accink:#fff;--ok:#1f9d63;--bad:#d9534f;--gold:#f0a202;--line:#c9dde2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08202c;--card:#0f3042;--ink:#e6f4f7;--mut:#8fb0bd;--acc:#35c2d0;--accink:#06222c;--ok:#3ccf8a;--bad:#f07a74;--gold:#ffc23d;--line:#1f4357;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08202c;--card:#0f3042;--ink:#e6f4f7;--mut:#8fb0bd;--acc:#35c2d0;--accink:#06222c;--ok:#3ccf8a;--bad:#f07a74;--gold:#ffc23d;--line:#1f4357;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:1rem;font-weight:600;margin:22px 0 8px;color:var(--mut)}
p{margin:0 0 8px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip,.btn,.opt{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"],.seg[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:var(--accink);font-weight:600}
.seg{flex:1;text-align:center}
.btn.go{width:100%;margin-top:26px;background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:800;font-size:1.1rem;text-align:center;padding:15px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--mut);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}

.qt{font-size:1.35rem;font-weight:800;margin-top:6px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.opt{font-weight:600;min-height:58px;display:flex;align-items:center}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}

.next{width:100%;margin-top:12px;background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center;font-weight:800}
.fb{min-height:1.4em;font-weight:600;margin:10px 0 0;text-align:center}
.res{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px 16px;text-align:center}
.res .big{font-size:3rem}
.sc{font-size:3rem;font-weight:800}
.foot{font-size:.8rem;margin-top:24px;text-align:center}
.sec{color:#fff;border-radius:14px;padding:12px 14px;font-weight:800;margin:24px 0 10px}
.unit{text-align:center;margin:16px 0 6px}
.unit b{display:block}
.nodes{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:12px}

.node.cur{background:var(--acc);color:var(--accink)}
.node.dn{background:var(--gold);color:#3a2a00}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.6rem;font-weight:800}
.stat span{color:var(--mut);font-size:.9rem}
.boost{margin-top:12px;background:var(--gold);color:#3a2a00;border-radius:14px;padding:12px 14px;font-weight:800}
.task{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}

.rw{font-size:.85rem;color:var(--mut)}
.claim{margin-top:10px;width:100%;background:var(--gold);border-color:var(--gold);color:#3a2a00;font-weight:800;text-align:center}

.zone.up{color:var(--ok)}
.zone.dn{color:var(--bad)}
.rk{display:inline-block;width:1.8em;color:var(--mut)}
.opt.fo{font-size:2.6rem;justify-content:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

.cos svg{width:100%;height:auto}
.cos .c.off{border-color:var(--line)}

.badge{position:absolute;top:10px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;min-width:30px;padding:2px 8px;font-weight:800;border:3px solid var(--bg)}
.portal{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.portal i{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:conic-gradient(#7b2ff7,#35c2d0,#f107a3,#ffd23f,#7b2ff7);box-shadow:0 0 40px 16px rgba(123,47,247,.55);animation:warp 1s ease-in forwards}

@keyframes warp{0%{transform:scale(0) rotate(0)}100%{transform:scale(60) rotate(1080deg)}}
@keyframes pfade{to{opacity:0}}
.bagin{background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.35) 0 2px,transparent 3px),radial-gradient(circle at 82% 28%,rgba(255,255,255,.3) 0 2px,transparent 3px),radial-gradient(circle at 62% 82%,rgba(255,255,255,.3) 0 2px,transparent 3px),radial-gradient(circle at 30% 60%,rgba(255,255,255,.25) 0 1.5px,transparent 2.5px),linear-gradient(160deg,#3b1677,#12234a);border-radius:24px;padding:16px;min-height:75vh}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.mcard{background:var(--bg);border-radius:20px;padding:16px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.mopt{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-weight:700}

.btimer{display:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);margin:10px auto 0;width:max-content;max-width:calc(100% - 24px);z-index:30;background:var(--gold);color:#3a2a00;font-weight:800;padding:8px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-variant-numeric:tabular-nums;white-space:nowrap}
.task.map{background:#f3e3bf;border:2px dashed #a0784a;color:#3b2a14}

.loot{margin-top:8px;font-weight:800;background:#fff7d6;border:2px solid #e0b84a;border-radius:12px;padding:8px 10px;color:#3a2a00;animation:pop .45s ease-out}

.speak svg{width:80px;height:auto;flex:0 0 auto}

.clapL{animation:clapL .3s ease-in-out 5}

.tear{animation:tear 1.3s ease-in infinite}

.heart{transform-box:fill-box;transform-origin:center;animation:heart 1.4s ease-out infinite}

.bounce{animation:bounce .5s ease-in-out 4}

.twinkle{animation:tw .8s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.prow{width:100%;font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.mcard .avatar svg{width:110px}
.mcard .stats{grid-template-columns:1fr 1fr}
.tap{position:fixed;z-index:100;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%) scale(.7);background:rgba(128,128,128,.25);border:2px solid rgba(128,128,128,.35);animation:tapf .55s ease-out forwards}
@keyframes tapf{to{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.tap{animation:tapr .55s linear forwards}@keyframes tapr{to{opacity:0}}}
.unit{position:relative}
.pal{position:absolute;top:70px;width:84px;pointer-events:none}
.pal svg{width:84px;height:auto;display:block}
.pal.dance{animation:dance .8s ease-in-out infinite;transform-origin:50% 100%}
.pal.jump{animation:jump 1.1s ease-in-out infinite}
.pal.sway{animation:sway 1.6s ease-in-out infinite;transform-origin:50% 100%}
.pal .clapL,.pal .clapR,.pal .bounce{animation-iteration-count:infinite}
@keyframes dance{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%,60%{transform:translateY(-14px)}}

button.avatar{width:100%;background:none;border:0;cursor:pointer;padding:0}

.tabs{gap:6px}

.rkb svg{vertical-align:middle;margin:-4px 5px 0 0}

.rup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;align-content:center;background:radial-gradient(circle,var(--rc) 0%,#0d1b2a 85%);color:#fff;text-align:center;overflow:hidden;animation:rfade .3s ease-out;cursor:pointer}

.frame::before{content:"";position:absolute;top:-16px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#1d1d1d}
